name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  private-data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on runtime data committed to the repo
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(db|sqlite3?|log)$|\.db\.bak-' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Runtime/private files must live in ~/.kampung, not the repo:"
            echo "$bad"
            exit 1
          fi

  frozen-save-fixtures:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save fixtures already on the base branch are never changed or removed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=DMRT "origin/$BASE" HEAD -- test/fixtures/saves/)
          if [ -n "$changed" ]; then
            echo "Shipped save fixtures are frozen (docs/design/upgrades.md). Fix a mistake with a new upgrade step instead:"
            echo "$changed"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  watch-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Headless Chromium for Playwright
        run: npx playwright install --with-deps --only-shell chromium
      - name: Watch page loads and draws in a browser
        run: npm run test:page
