<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Kampung</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="line">
      <div class="brand">Pixel Kampung</div>
      <div class="clock" id="clock">Connecting…</div>
      <div class="version" id="version"></div>
      <div class="mode" id="mode"></div>
      <button type="button" class="wiki-open" id="wiki-open" aria-haspopup="dialog">Wiki</button>
    </div>
    <div class="replay" id="replay" hidden>
      <button type="button" id="play" aria-label="Play or pause">❚❚</button>
      <label class="speed">Speed
        <select id="speed">
          <option value="1">1×</option>
          <option value="10">10×</option>
          <option value="60">60×</option>
          <option value="300">300×</option>
          <option value="1440">1440×</option>
        </select>
      </label>
      <input type="range" id="seek" min="0" max="1" value="0" step="1" aria-label="Seek">
      <select id="trial" aria-label="Trial to replay"></select>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main class="layout">
    <section class="map-col">
      <div class="map" id="map"><div class="stage" id="stage"></div></div>
      <button type="button" class="zoom" id="zoom" aria-pressed="false" aria-label="Zoom the map">+</button>
      <aside class="card" id="card" hidden aria-live="polite"></aside>
    </section>
    <section class="side">
      <nav class="roster" id="roster" aria-label="Residents"></nav>
      <div class="feed-head">
        <h2>Story feed</h2>
        <div class="toggle" role="group" aria-label="Which moments to show">
          <button type="button" id="feed-key" aria-pressed="true">Key moments</button>
          <button type="button" id="feed-all" aria-pressed="false">All</button>
        </div>
      </div>
      <ol class="feed" id="feed" reversed></ol>
    </section>
  </main>
  <section class="wiki" id="wiki" role="dialog" aria-label="Kampung wiki" hidden>
    <header>
      <h2>Kampung wiki</h2>
      <span class="wiki-version" id="wiki-version"></span>
      <button type="button" class="close" id="wiki-close" aria-label="Close the wiki">×</button>
    </header>
    <nav class="tabs" id="wiki-tabs" role="tablist">
      <button type="button" role="tab" data-wiki="people" aria-selected="true">People</button>
      <button type="button" role="tab" data-wiki="places" aria-selected="false">Places</button>
      <button type="button" role="tab" data-wiki="how" aria-selected="false">How it works</button>
      <button type="button" role="tab" data-wiki="economy" aria-selected="false">Economy</button>
      <button type="button" role="tab" data-wiki="news" aria-selected="false">What's new</button>
    </nav>
    <div class="wiki-body" id="wiki-body"></div>
    <footer>Owner's view. Nothing in the wiki ever reaches a resident.</footer>
  </section>
  <script src="/app.js"></script>
</body>
</html>
